[project]
name = "over-personalization"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.33.0",
]

[dependency-groups]
# vLLM 0.19.1 is the newest release built on CUDA 12.8; later ones need CUDA 13 (driver >= 580), eniac has 570.
gpu = [
    "peft>=0.21.2 ; sys_platform == 'linux'",
    "transformers>=4.57,<5 ; sys_platform == 'linux'",
    "trl==1.13.0 ; sys_platform == 'linux'",
    "vllm==0.19.1 ; sys_platform == 'linux'",
]

[tool.uv]
# The GPU group only applies on Linux (eniac), so installing it by default changes nothing on a Mac.
default-groups = ["gpu"]

[tool.pytest.ini_options]
pythonpath = ["."]
